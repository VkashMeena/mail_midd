{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful — AI Smart Mail Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      background-color: var(--background);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="auth-card card p-4 p-md-5 text-center">
    <div class="rounded-circle bg-success-subtle text-success mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
      <i class="bi bi-shield-check fs-2"></i>
    </div>
    <h4 class="fw-bold mb-2">Password Reset Complete</h4>
    <p class="text-muted small mb-4">
      Your password has been successfully reset. You may now sign in using your new credentials.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
