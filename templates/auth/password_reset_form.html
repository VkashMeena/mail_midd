{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — AI Smart Mail Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      background-color: var(--background);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="auth-card card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-icon-box mx-auto mb-2" style="width: 44px; height: 44px;">
        <i class="bi bi-shield-lock-fill fs-4"></i>
      </div>
      <h4 class="fw-bold mb-1">Forgot Password?</h4>
      <p class="text-muted small">Enter your email and we'll send you instructions to reset your password.</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 small mb-3">
        Please enter a valid email address.
      </div>
    {% endif %}

    <form method="POST" action="{% url 'password_reset' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_email" class="form-label small fw-semibold">Email Address</label>
        <input type="email" name="email" id="id_email" class="form-control form-control-lg" placeholder="name@company.com" required autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-send me-1"></i> Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 small text-muted">
      Remember your password?
      <a href="{% url 'accounts:login' %}" class="fw-semibold text-decoration-none">Sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
