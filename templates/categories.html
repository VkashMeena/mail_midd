{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="d-flex flex-column gap-4">
  <!-- Header -->
  <div>
    <h3 class="fw-bold mb-1">Email Categories</h3>
    <p class="text-muted small mb-0">Browse correspondence grouped by AI-detected taxonomy</p>
  </div>

  <!-- Categories Grid -->
  <div class="row g-3">
    {% for cat in categories %}
      <div class="col-12 col-sm-6 col-md-4 col-xl-3">
        <a href="{% url 'category_detail' cat.name %}" class="category-card card p-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="category-icon-box {{ cat.meta.bg }} {{ cat.meta.text }} mb-0">
              <i class="bi {{ cat.meta.icon }}"></i>
            </div>
            <span class="badge bg-secondary-subtle text-secondary fs-6">{{ cat.count }}</span>
          </div>

          <h5 class="fw-bold mb-1 text-truncate">{{ cat.name }}</h5>
          <p class="text-muted small mb-0">View categorized email threads</p>

          <div class="mt-3 pt-3 border-top d-flex align-items-center justify-content-between text-muted small">
            <span>Explore folder</span>
            <i class="bi bi-arrow-right"></i>
          </div>
        </a>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
