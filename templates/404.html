{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5">
  <div class="card p-5 text-center shadow-sm" style="max-width: 520px; width: 100%;">
    <div class="rounded-circle bg-danger-subtle text-danger mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px;">
      <i class="bi bi-exclamation-diamond fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-body mb-2">404</h1>
    <h5 class="fw-semibold mb-3">Page Not Found</h5>
    <p class="text-muted mb-4">
      The email view, filter, or application resource you requested does not exist or may have been moved.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> Back to Dashboard
      </a>
      <a href="{% url 'inbox' %}" class="btn btn-outline-secondary">
        <i class="bi bi-inbox me-1"></i> Inbox
      </a>
    </div>
  </div>
</div>
{% endblock %}
