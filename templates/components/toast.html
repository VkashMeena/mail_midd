<div id="globalToastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
  {% if messages %}
    {% for message in messages %}
      <div class="toast align-items-center border-0 shadow-lg mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          {% if 'success' in message.tags %}
            <i class="bi bi-check-circle-fill text-success me-2"></i>
            <strong class="me-auto">Success</strong>
          {% elif 'error' in message.tags %}
            <i class="bi bi-x-circle-fill text-danger me-2"></i>
            <strong class="me-auto">Notice</strong>
          {% elif 'warning' in message.tags %}
            <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
            <strong class="me-auto">Warning</strong>
          {% else %}
            <i class="bi bi-info-circle-fill text-primary me-2"></i>
            <strong class="me-auto">Notification</strong>
          {% endif %}
          <small class="text-muted">just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          {{ message }}
        </div>
      </div>
    {% endfor %}
  {% endif %}
</div>
